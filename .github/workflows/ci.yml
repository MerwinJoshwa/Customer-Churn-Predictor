name: Full-Stack CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend Tests & ML Validation
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: churn_db
          MYSQL_USER: churn_user
          MYSQL_PASSWORD: churn_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest

    - name: Train and Validate ML Pipeline
      env:
        DATABASE_URL: "mysql+pymysql://churn_user:churn_password@127.0.0.1:3306/churn_db"
        FALLBACK_SQLITE: "true"
      run: |
        python backend/training/train.py
        python backend/training/evaluate.py

    - name: Run Backend Test Suite
      env:
        DATABASE_URL: "mysql+pymysql://churn_user:churn_password@127.0.0.1:3306/churn_db"
        FALLBACK_SQLITE: "true"
      run: |
        python -m pytest backend/tests -v

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build Production Assets
      working-directory: ./frontend
      run: npm run build

  docker-build:
    name: Docker Image Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Backend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: false
        tags: churn-backend:test

    - name: Build Frontend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: false
        tags: churn-frontend:test
